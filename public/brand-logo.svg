<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e101f"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>

    <!-- Outer Neon Glow Border -->
    <filter id="brandNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#a855f7" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>

    <!-- Question Mark Gradient & Glow -->
    <linearGradient id="brandQGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="brandPurpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>

    <!-- Glowing Eye -->
    <filter id="brandEyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f3e8ff" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#c084fc" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Icon Frame with Neon Rim -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#brandBgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#a855f7" stroke-width="7" filter="url(#brandNeonGlow)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#c084fc" stroke-width="3"/>

  <!-- Split Face Container -->
  <g transform="translate(0, -15)">
    <!-- Right Half (Dark Mischievous Side) -->
    <path d="M 256,65 A 155,155 0 0,1 411,220 A 155,155 0 0,1 256,375 Z" fill="#111322"/>
    <path d="M 256,65 A 155,155 0 0,1 411,220 A 155,155 0 0,1 256,375 Z" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.3"/>

    <!-- Dark Side Mischievous Slanted Glowing Eye -->
    <path d="M 312,230 Q 355,190 388,198 Q 350,248 312,230 Z" fill="#ffffff" filter="url(#brandEyeGlow)"/>

    <!-- Dark Side Smirk -->
    <path d="M 285,308 Q 325,322 358,292" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Half (Bright Friendly Emoji Side) -->
    <path d="M 256,65 A 155,155 0 0,0 101,220 A 155,155 0 0,0 256,375 Z" fill="#f8fafc"/>

    <!-- Left Side Friendly Eyebrow & Eye -->
    <path d="M 158,172 Q 185,152 212,162" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="188" cy="214" rx="19" ry="25" fill="#1e293b"/>

    <!-- Left Side Friendly Smile -->
    <path d="M 188,298 Q 220,330 256,330" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>

    <!-- Central Impostor Question Mark with Neon Violet Glow -->
    <g filter="url(#brandPurpleGlow)">
      <path d="M 224,180 C 224,136 250,116 272,116 C 298,116 314,132 314,154 C 314,178 288,196 274,217 C 264,231 261,244 261,258 L 250,258 C 250,237 256,220 268,204 C 279,189 296,174 296,155 C 296,143 286,134 272,134 C 257,134 243,146 241,175 Z" fill="url(#brandQGrad)"/>
      <circle cx="256" cy="290" r="15" fill="url(#brandQGrad)"/>
    </g>
  </g>

  <!-- BLENDIN Logo Text at Bottom -->
  <g transform="translate(256, 444)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="5" fill="#ffffff">
      BLEND<tspan fill="#a855f7">IN</tspan>
    </text>
  </g>
</svg>
